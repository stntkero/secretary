<style>
:root{
  --bg:#f4f6fa;--card:#fff;--text:#1b2430;--muted:#66717f;--line:#e2e7ee;
  --brand:#0b3d91;--brand-2:#1f5bd6;--ok:#1d8f4e;--warn:#c77700;--bad:#c62828;--sale:#1f5bd6;--recruit:#7b3fa0;
  --r:12px;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 8px rgba(16,24,40,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#121820;--card:#1b232e;--text:#e8edf3;--muted:#9aa6b4;--line:#2b3542;--brand:#5b8def;--brand-2:#6f9cf5;--shadow:none}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI","Noto Sans TC","Microsoft JhengHei",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2);text-decoration:none}
h1,h2,h3{margin:0 0 .4em;line-height:1.3}
h1{font-size:22px}h2{font-size:18px}h3{font-size:16px}
.muted{color:var(--muted)}.small{font-size:13px}
.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--brand);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}
.side .logo{font-weight:700;font-size:19px;margin:4px 8px 22px;letter-spacing:.5px}
.side nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;color:#dfe7f7;padding:11px 12px;border-radius:10px;cursor:pointer;font-size:15px}
.side nav button.on{background:rgba(255,255,255,.16);color:#fff;font-weight:600}
.side nav button:hover{background:rgba(255,255,255,.1)}
.side .foot{position:absolute;bottom:18px;left:14px;right:14px;font-size:12px;color:#b9c7e6}
main{padding:22px 26px 90px;max-width:1240px;width:100%}
.tabbar{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
.card h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e9eef8;color:var(--brand);font-weight:600;white-space:nowrap}
.badge.sale{background:#e6eefc;color:var(--sale)}.badge.recruit{background:#f1e8f8;color:var(--recruit)}
.badge.warn{background:#fff3e0;color:var(--warn)}.badge.bad{background:#fdecea;color:var(--bad)}.badge.ok{background:#e6f4ea;color:var(--ok)}
.badge.gray{background:#eef1f5;color:var(--muted)}
@media (prefers-color-scheme:dark){.badge{background:#243149}.badge.sale{background:#213457}.badge.recruit{background:#36264a}.badge.warn{background:#4a3410}.badge.bad{background:#4a1f1f}.badge.ok{background:#1e3a2a}.badge.gray{background:#2b3542}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--brand-2)}
.btn.p{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.d{color:var(--bad);border-color:#f1c2c2}
.btn.s{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--brand-2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sb{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid2>*,.two>*,.card{min-width:0}
.md{font-size:14px;line-height:1.65;overflow-wrap:anywhere}
.md h3,.md h4,.md h5{margin:14px 0 6px;line-height:1.3}.md h3{font-size:17px}.md h4{font-size:15px;color:var(--brand)}.md h5{font-size:14px}
.md p{margin:6px 0}.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:2px 0}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:3px solid var(--brand);background:var(--bg);border-radius:6px}
.md .tw{overflow-x:auto;margin:8px 0}.md table{border-collapse:collapse;font-size:13px;width:100%}.md th,.md td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:top;overflow-wrap:anywhere}.md th{background:var(--bg);font-weight:600}
.md code{background:var(--bg);padding:1px 5px;border-radius:4px;font-size:13px}.md hr{border:0;border-top:1px solid var(--line);margin:10px 0}.md a{color:var(--brand-2)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi .card{margin:0;padding:12px 14px;cursor:pointer}
.kpi .n{font-size:26px;font-weight:700;color:var(--brand-2)}
.kpi .l{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;padding:11px 4px;border-top:1px solid var(--line);cursor:pointer}
.item:first-child{border-top:0}
.item:hover{background:rgba(31,91,214,.04)}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .d{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.item .r{text-align:right;font-size:13px;color:var(--muted);white-space:nowrap}
.avatar{width:38px;height:38px;border-radius:50%;background:#dfe7f7;color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.empty{color:var(--muted);padding:14px 4px;text-align:center}
input[type=text],input[type=search],input[type=date],input[type=time],input[type=number],input[type=password],input[type=email],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text)}
textarea{min-height:76px;resize:vertical}
label.f{display:block;margin-bottom:10px}
label.f span.l{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fgrid .w{grid-column:1/-1}
.chk{display:flex;align-items:center;gap:8px;margin:6px 0 12px;cursor:pointer}
.chk input{width:18px;height:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.chip input{display:none}.chip:has(input:checked){background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.chips.sm .chip{padding:3px 9px;font-size:12px}
.stat{display:grid;grid-template-columns:1fr auto auto;gap:4px 14px;font-size:14px}.stat .h{font-size:12px;color:var(--muted)}.stat b{font-size:16px}
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal .box{background:var(--card);border-radius:16px;width:100%;max-width:680px;max-height:92vh;overflow:auto;padding:20px 22px}
.modal h3{margin-bottom:14px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;position:sticky;bottom:-20px;background:var(--card);padding:12px 0 2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#222c3a;color:#fff;padding:10px 16px;border-radius:10px;z-index:99;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw}
.two{display:grid;grid-template-columns:380px 1fr;gap:16px;align-items:start}
.sec{margin-top:18px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:14px}
.kv .k{color:var(--muted)}
.log{border-left:3px solid var(--line);padding:6px 12px;margin:10px 0}
.log.survey{border-color:var(--warn)}
.log .h{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.log p{margin:4px 0;white-space:pre-wrap}
.ob{background:#fff8e6;border-radius:8px;padding:6px 10px;font-size:14px;margin-top:4px;white-space:pre-wrap}
@media (prefers-color-scheme:dark){.ob{background:#3a2d12}}
.task{display:flex;gap:10px;align-items:flex-start;padding:9px 2px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input{width:20px;height:20px;margin-top:3px;flex:none}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .main{flex:1}
.banner{background:#fff3e0;color:#6b4300;border:1px solid #ffd59a;border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
@media (prefers-color-scheme:dark){.banner{background:#4a3410;color:#ffd9a0;border-color:#6b4a14}}
.fab{display:none}
.daygroup{margin-top:14px}
.daygroup h4{margin:0 0 4px;font-size:14px;color:var(--muted);font-weight:600}
.daygroup.today h4{color:var(--brand-2)}
.daygroup.over h4{color:var(--bad)}
.rep{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px}
.rep.p5{grid-template-columns:1fr 1fr 1fr 1fr 1fr auto}
.rep input{padding:7px 9px}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.center .card{width:100%;max-width:420px;padding:26px}
.help p{margin:6px 0}
.help li{margin:4px 0}
code{background:rgba(127,127,127,.15);padding:1px 5px;border-radius:4px;font-size:13px}
.hide{display:none!important}
@media (max-width:1000px){
  .two{grid-template-columns:1fr}
  .two.detail .pane-list{display:none}
  .two:not(.detail) .pane-detail{display:none}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{display:none}
  main{padding:14px 14px 96px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
  .tabbar button{flex:1;background:none;border:0;padding:9px 0 7px;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .tabbar button .i{font-size:20px;line-height:1}
  .tabbar button.on{color:var(--brand-2);font-weight:600}
  .grid2,.grid3{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .fab{display:flex;position:fixed;right:18px;bottom:76px;width:54px;height:54px;border-radius:50%;background:var(--brand-2);color:#fff;border:0;font-size:30px;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(31,91,214,.4);z-index:41;cursor:pointer}
  .modal{align-items:flex-end;padding:0}
  .modal .box{border-radius:16px 16px 0 0;max-height:94vh}
  .rep,.rep.p5{grid-template-columns:1fr 1fr;}
  .rep .del{grid-column:1/-1;justify-self:end}
  .kpi{grid-template-columns:1fr 1fr}
}
@media print{.side,.tabbar,.fab,.btn{display:none!important}main{padding:0}}
</style>
</head>

 ['family','家庭狀況',['已婚','未婚','離異','新婚','準備生育','有小孩','小孩在學','小孩已成年','單親','與父母同住','父母年長需照顧','空巢期']],

/* ========= 工具 ========= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

const parseDate=s=>{if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d};

function fmtDate(s,withWd){const d=parseDate(s);if(!d)return s||'';const t=`${d.getMonth()+1}/${d.getDate()}`;return withWd?`${t}（${WD[d.getDay()]}）`:t}
function daysUntilAnnual(s){ // 'YYYY-MM-DD' 或 'MM-DD' → 距下次週年的天數
  if(!s)return null;const md=s.slice(-5);if(!/^\d\d-\d\d$/.test(md))return null;

/* ========= 加密 ========= */
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)}
function ub64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const ITER=200000;
async function deriveKey(pass,salt,iter){const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:iter||ITER,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
let keyCache={pass:null,salt:null,key:null};
async function encryptObj(obj,pass){
  if(keyCache.pass!==pass){const salt=crypto.getRandomValues(new Uint8Array(16));keyCache={pass,salt,key:await deriveKey(pass,salt)}}
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},keyCache.key,enc.encode(JSON.stringify(obj)));
  return {app:'sales-secretary',v:1,iter:ITER,salt:b64(keyCache.salt),iv:b64(iv),data:b64(ct),savedAt:Date.now()};
}
async function decryptObj(pkg,pass){
  if(!pkg||pkg.app!=='sales-secretary')throw new Error('不是本系統的同步檔');
  const key=await deriveKey(pass,ub64(pkg.salt),pkg.iter);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(pkg.iv)},key,ub64(pkg.data));
  return JSON.parse(dec.decode(pt));
}

async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite').objectStore('kv').put(v,k);t.onsuccess=()=>res();t.onerror=()=>rej(t.error)})}

function mergeState(a,b){
  const out=blank();let changed=0,localNewer=0;
  for(const col of ['clients','logs','tasks','policies','lists','listItems']){
    const ids=new Set([...Object.keys(a[col]||{}),...Object.keys(b[col]||{})]);
    for(const id of ids){const x=(a[col]||{})[id],y=(b[col]||{})[id];
      if(!x){out[col][id]=y;changed++}else if(!y){out[col][id]=x;localNewer++}else if((y.updatedAt||0)>(x.updatedAt||0)){out[col][id]=y;changed++}else{out[col][id]=x;if((x.updatedAt||0)>(y.updatedAt||0))localNewer++}}
  }
  const sa=(a.settings||{}).updatedAt||0,sb=(b.settings||{}).updatedAt||0;
  out.settings=sb>sa?b.settings:a.settings;if(sa>sb)localNewer++;
  return {state:out,changed,localNewer};
}

function gisReady(){return new Promise(res=>{const t0=Date.now();(function chk(){if(window.google&&google.accounts&&google.accounts.oauth2)return res(true);if(Date.now()-t0>8000)return res(false);setTimeout(chk,100)})()})}
async function getTokenClient(){if(tokenClient)return tokenClient;if(!(await gisReady()))throw new Error('Google 登入元件載入失敗，請確認有網路後重新整理');
  tokenClient=google.accounts.oauth2.initTokenClient({client_id:clientId(),scope:SCOPES,callback:()=>{},error_callback:()=>{}});return tokenClient}
function validTok(){return GTOK&&GTOK.t&&GTOK.exp>Date.now()+60000?GTOK.t:null}
async function requestToken(kind,extra){ // kind: 'select' | 'silent' | 'add'（加權限）
  const tc=await getTokenClient();
  return new Promise((res,rej)=>{
    tc.callback=r=>{if(r&&r.access_token){GTOK={t:r.access_token,exp:Date.now()+((+r.expires_in)||3600)*1000,scope:r.scope||''};try{localStorage.setItem('ss.gtok',JSON.stringify(GTOK))}catch{}needAuth=false;res(GTOK.t)}else rej(new Error((r&&r.error)||'no_token'))};
    tc.error_callback=e=>rej(new Error((e&&e.type)||'popup_failed'));
    const o={prompt:kind==='select'?'select_account':'',scope:scopes(extra)};if(kind!=='select'&&GACCT&&GACCT.email)o.hint=GACCT.email;
    tc.requestAccessToken(o);
  });
}
async function getToken(){const t=validTok();if(t)return t;try{return await requestToken('silent')}catch(e){needAuth=true;throw new Error('NOAUTH')}}
async function gfetch(url,opt={}){
  const tok=await getToken();
  const r=await fetch(url,Object.assign({},opt,{headers:Object.assign({},opt.headers||{},{Authorization:'Bearer '+tok})}));
  if(r.status===401){GTOK=null;localStorage.removeItem('ss.gtok');needAuth=true;throw new Error('NOAUTH')}
  if(!r.ok){let m='';try{m=(await r.json()).error.message}catch{}throw new Error(`雲端硬碟回應 ${r.status}${m?'：'+m:''}`)}
  return r;
}
async function cloudFind(){const q=encodeURIComponent(`name='${CLOUD_FILE}' and trashed=false`);const r=await gfetch(`${DRIVE}/files?spaces=appDataFolder&q=${q}&fields=files(id,modifiedTime,size)&orderBy=modifiedTime%20desc&pageSize=5`);return ((await r.json()).files||[])[0]||null}
async function cloudRead(id){const r=await gfetch(`${DRIVE}/files/${id}?alt=media`);return r.json()}
async function cloudWrite(id,obj){
  const body=JSON.stringify(obj);
  if(id){const r=await gfetch(`${DRIVE_UP}/files/${id}?uploadType=media&fields=id,modifiedTime`,{method:'PATCH',headers:{'Content-Type':'application/json'},body});return r.json()}
  const meta={name:CLOUD_FILE,parents:['appDataFolder'],mimeType:'application/json'},b='ss_boundary_'+Date.now();
  const mp=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json\r\n\r\n${body}\r\n--${b}--`;
  const r=await gfetch(`${DRIVE_UP}/files?uploadType=multipart&fields=id,modifiedTime`,{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${b}`},body:mp});return r.json();
}
function scheduleCloudSync(ms){if(MODE!=='google')return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSync(),ms||2000)}
function cloudSyncThrottled(){if(Date.now()-lastCloudCheck>20000)cloudSync()}
async function cloudSync(opts={}){
  if(MODE!=='google'||!S)return false;
  if(cloudBusy){cloudPending=true;return false}
  cloudBusy=true;lastCloudCheck=Date.now();let ok=false;
  try{
    setSyncStatus('同步中…');
    const f=await cloudFind();
    if(f&&(opts.force||f.modifiedTime!==lastCloudMod)){
      const remote=await cloudRead(f.id);
      if(remote&&remote.app==='sales-secretary'&&remote.clients){
        migrate(remote);const {state,changed,localNewer}=mergeState(S,remote);S=state;
        if(localNewer)cloudDirty=true;
        if(changed){await doSaveLocal();render();toast(`已從雲端合併 ${changed} 筆更新`)}
      }
      lastCloudMod=f.modifiedTime;
    }
    if(!f||cloudDirty||opts.push){
      const j=await cloudWrite(f?f.id:null,Object.assign({app:'sales-secretary',savedAt:Date.now()},S));
      if(j&&j.modifiedTime)lastCloudMod=j.modifiedTime;cloudDirty=false;try{localStorage.removeItem('ss.cloudDirty')}catch{}
    }
    try{localStorage.setItem('ss.cloudMod',lastCloudMod)}catch{}
    markSync();setSyncStatus('已同步 '+timeNow());ok=true;
    if($('#authBanner'))render();
    if(gcalOn()&&Date.now()-gcalLast>20000)scheduleGcalSync(300);
  }catch(e){
    if(e.message==='NOAUTH'){setSyncStatus('需要重新連線 Google');if(!$('#authBanner'))render()}
    else{console.warn(e);setSyncStatus('同步失敗：'+e.message);if(opts.loud)toast('同步失敗：'+e.message)}
  }finally{cloudBusy=false;if(cloudPending){cloudPending=false;scheduleCloudSync(500)}}
  return ok;
}

let gcalBusy=false,gcalTimer=null,gcalLast=0,gcalErr='';
const nextDay=d=>{const x=parseDate(d);x.setDate(x.getDate()+1);return iso(x)};
function shiftTime(date,time,mins){const d=new Date(`${date}T${time}:00`);d.setMinutes(d.getMinutes()+mins);return {date:iso(d),time:`${pad(d.getHours())}:${pad(d.getMinutes())}`}}
function scheduleGcalSync(ms){if(!gcalOn())return;clearTimeout(gcalTimer);gcalTimer=setTimeout(()=>gcalSync(),ms||3000)}
async function gcalEnsureCalendar(){
  const g=S.settings.gcal||{};
  if(g.calendarId){try{await gfetch(`${CAL_API}/calendars/${encodeURIComponent(g.calendarId)}`);return g.calendarId}catch(e){if(!/404|410/.test(e.message))throw e}}
  const rebind=id=>{for(const t of Object.values(S.tasks)){delete t.gcalId;delete t.gcalSynced;delete t.gcalUpdated}setSettings({gcal:Object.assign({},g,{calendarId:id})})}; // 換了日曆：所有行程重新推送
  try{const r=await gfetch(`${CAL_API}/users/me/calendarList?minAccessRole=owner`);const f=((await r.json()).items||[]).find(c=>c.summary===CAL_NAME);
    if(f){rebind(f.id);return f.id}}catch(e){console.warn(e)}
  const r=await gfetch(`${CAL_API}/calendars`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({summary:CAL_NAME,description:'由業務秘書程式自動同步的行程與待辦',timeZone:'Asia/Taipei'})});
  const cal=await r.json();
  try{await gfetch(`${CAL_API}/users/me/calendarList/${encodeURIComponent(cal.id)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({colorId:'9'})})}catch{}
  rebind(cal.id);return cal.id;
}
function taskToEvent(t){
  const c=t.clientId?C(t.clientId):null;const name=(c&&!c.deleted)?c.name:'';
  const summary=(t.done?'✅ ':'')+t.title+(name&&!t.title.includes(name)?`（${name}）`:'');
  const desc=[t.note||'',name?`客戶：${name}${c.phone?' '+c.phone:''}`:'',t.type?`類型：${t.type}`:'','— 由業務秘書同步'].filter(Boolean).join('\n');
  const ev={summary,description:desc,extendedProperties:{private:{ssId:t.id}}};
  if(t.time&&/^\d{2}:\d{2}$/.test(t.time)){const e=shiftTime(t.date,t.time,60);ev.start={dateTime:`${t.date}T${t.time}:00`,timeZone:'Asia/Taipei'};ev.end={dateTime:`${e.date}T${e.time}:00`,timeZone:'Asia/Taipei'}}
  else{ev.start={date:t.date};ev.end={date:nextDay(t.date)}}
  return ev;
}
function eventToTask(ev,t){
  const o={};let title=(ev.summary||'（無標題）').trim();let done=false;if(title.startsWith('✅')){done=true;title=title.slice(1).trim()}
  if(t&&t.clientId){const c=C(t.clientId);if(c&&title.endsWith(`（${c.name}）`))title=title.slice(0,-(c.name.length+2))}
  o.title=title.trim()||'（無標題）';o.done=done;
  if(ev.start&&ev.start.dateTime){const d=new Date(ev.start.dateTime);o.date=iso(d);o.time=`${pad(d.getHours())}:${pad(d.getMinutes())}`}
  else if(ev.start&&ev.start.date){o.date=ev.start.date;o.time=''}
  o.note=(ev.description||'').split('\n').filter(l=>!/^(客戶：|類型：|— 由業務秘書同步)/.test(l)).join('\n').trim();
  return o;
}
async function gcalSync(opts={}){
  if(MODE!=='google'||!gcalOn()||gcalBusy)return false;
  gcalBusy=true;gcalLast=Date.now();let pulled=0,pushed=0,ok=false;
  try{
    const calId=await gcalEnsureCalendar();const base=`${CAL_API}/calendars/${encodeURIComponent(calId)}/events`;const tokKey='ss.gcalTok.'+calId;
    // 拉：日曆端的新增 / 修改 / 刪除
    let tok=null;try{tok=localStorage.getItem(tokKey)}catch{}
    let pageToken=null,nextSync=null,items=[];
    for(let guard=0;guard<30;guard++){
      const q=new URLSearchParams({maxResults:'250',showDeleted:'true',singleEvents:'true'});
      if(pageToken)q.set('pageToken',pageToken);else if(tok)q.set('syncToken',tok);else q.set('timeMin',new Date(Date.now()-90*864e5).toISOString());
      let r;try{r=await gfetch(`${base}?${q}`)}catch(e){if(/410/.test(e.message)&&tok){tok=null;pageToken=null;try{localStorage.removeItem(tokKey)}catch{}continue}throw e}
      const j=await r.json();items=items.concat(j.items||[]);
      if(j.nextPageToken){pageToken=j.nextPageToken;continue}
      nextSync=j.nextSyncToken||null;break;
    }
    const byG={};for(const t of Object.values(S.tasks))if(t.gcalId)byG[t.gcalId]=t;
    for(const ev of items){
      const ssId=ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.ssId;
      const t=(ssId&&S.tasks[ssId])||byG[ev.id];const evUp=Date.parse(ev.updated||'')||0;
      if(ev.status==='cancelled'){if(t&&!t.deleted){t.deleted=true;t.updatedAt=Date.now();t.gcalSynced=t.updatedAt;pulled++}continue}
      if(t){
        if(t.deleted)continue;
        if(evUp>(t.gcalUpdated||0)&&evUp>(t.updatedAt||0)){Object.assign(t,eventToTask(ev,t),{gcalId:ev.id,gcalUpdated:evUp});t.updatedAt=Date.now();t.gcalSynced=t.updatedAt;pulled++}
        else if(!t.gcalId){t.gcalId=ev.id;t.gcalUpdated=evUp}
      }else{
        const nt=Object.assign({id:uid(),clientId:'',createdAt:Date.now()},eventToTask(ev,null),{gcalId:ev.id,gcalUpdated:evUp});
        nt.type=nt.time?'行程':'待辦';nt.updatedAt=Date.now();nt.gcalSynced=nt.updatedAt;S.tasks[nt.id]=nt;pulled++;
      }
    }
    if(nextSync){try{localStorage.setItem(tokKey,nextSync)}catch{}}
    // 推：程式端的新增 / 修改 / 刪除
    const oldCut=iso(new Date(Date.now()-90*864e5));let failed=0,lastErr='';
    for(const t of Object.values(S.tasks)){
      if((t.updatedAt||0)<=(t.gcalSynced||0))continue;
      try{
        if(t.deleted){if(t.gcalId){try{await gfetch(`${base}/${encodeURIComponent(t.gcalId)}`,{method:'DELETE'})}catch(e){if(!/404|410/.test(e.message))throw e}}t.gcalSynced=t.updatedAt;pushed++;continue}
        if(!t.date||(!t.gcalId&&t.date<oldCut)){t.gcalSynced=t.updatedAt;continue}
        const body=JSON.stringify(taskToEvent(t));let r=null;
        if(t.gcalId){try{r=await gfetch(`${base}/${encodeURIComponent(t.gcalId)}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body})}catch(e){if(/404|410/.test(e.message))t.gcalId=null;else throw e}}
        if(!t.gcalId)r=await gfetch(base,{method:'POST',headers:{'Content-Type':'application/json'},body});
        const ev=await r.json();t.gcalId=ev.id;t.gcalUpdated=Date.parse(ev.updated||'')||Date.now();t.gcalSynced=t.updatedAt;pushed++;
      }catch(e){if(e.message==='NOAUTH')throw e;failed++;lastErr=e.message;console.warn('gcal push failed',t.id,e)} // 單筆失敗不影響其他行程，下次再試
    }
    gcalErr=failed?`有 ${failed} 筆未能同步：${lastErr}`:'';try{localStorage.setItem('ss.gcalLastAt',String(Date.now()))}catch{}
    if(pulled||pushed){await doSaveLocal();cloudDirty=true;try{localStorage.setItem('ss.cloudDirty','1')}catch{}scheduleCloudSync();render();if(pulled)toast(`已從 Google 日曆更新 ${pulled} 筆`)}
    ok=true;
  }catch(e){
    if(e.message!=='NOAUTH'){console.warn(e);gcalErr=/calendar-json|has not been used|is disabled/i.test(e.message)?'Google Cloud 專案尚未啟用 Calendar API':e.message;if(opts.loud)toast('日曆同步失敗：'+gcalErr)}
  }finally{gcalBusy=false}
  return ok;
}
async function gcalEnable(){
  if(MODE!=='google'){alert('Google 日曆連動需要先用 Google 帳號登入。');return}
  try{await requestToken('add',true)}catch(e){if(!/popup_closed|access_denied/.test(e.message))alert('無法取得日曆權限：'+e.message);return}
  if(!((GTOK&&GTOK.scope)||'').includes('calendar.app.created')){alert('沒有取得日曆權限，無法連動。請重試並勾選允許日曆。');return}
  setSettings({gcal:Object.assign({},S.settings.gcal||{},{enabled:true,calendarId:(S.settings.gcal||{}).calendarId||''})});
  toast('正在建立「業務秘書」日曆並同步…');
  try{await gcalEnsureCalendar();const ok=await gcalSync({loud:true});render();if(ok)toast('已連動 Google 日曆')}
  catch(e){setSettings({gcal:Object.assign({},S.settings.gcal||{},{enabled:false})});render();alert('連動失敗：'+(/calendar-json|has not been used|is disabled/i.test(e.message)?'Google Cloud 專案尚未啟用 Calendar API，請先到 API 程式庫啟用「Google Calendar API」。':e.message))}
}

async function exportFile(share){
  let p=PASS;if(MODE==='google'){p=prompt('請為這份備份檔設定一組密碼（之後匯入時需要）：');if(!p)return;if(p.length<6){alert('密碼至少 6 碼');return}}
  const pkg=await encryptObj(S,p);if(MODE==='google')keyCache={pass:null};
  const name=`業務秘書同步檔.json`;
  const file=new File([JSON.stringify(pkg)],name,{type:'application/json'});
  if(share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});markSync();return}catch(e){if(e.name==='AbortError')return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  markSync();toast('已下載，請存到雲端硬碟資料夾');
}
function importFile(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    let pkg;try{pkg=JSON.parse(await f.text())}catch{alert('檔案格式不正確');return}
    let remote;try{remote=await decryptObj(pkg,PASS)}catch{
      const p=prompt('這個檔案用的密碼和目前不同，請輸入該檔案的密碼：');if(!p)return;
      try{remote=await decryptObj(pkg,p)}catch{alert('密碼錯誤或檔案損毀');return}}
    migrate(remote);const {state,changed}=mergeState(S,remote);S=state;markSync();save();render();toast(`匯入完成，合併 ${changed} 筆更新`)};
  inp.click();
}

/* ========= 秘書提醒計算 ========= */
function brief(){
  const t=today(),st=S.settings,cl=live('clients'),tasks=live('tasks');
  const todayTasks=tasks.filter(x=>x.date===t&&!x.done).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const overdue=tasks.filter(x=>x.date<t&&!x.done).sort((a,b)=>a.date.localeCompare(b.date));
  const upcoming=tasks.filter(x=>x.date>t&&!x.done&&daysBetween(t,x.date)<=7).sort((a,b)=>a.date.localeCompare(b.date));
  const bdays=[];
  for(const c of cl){
    const d=daysUntilAnnual(c.birthday);if(d!==null&&d<=st.birthdayDays)bdays.push({client:c,who:c.name,rel:'本人',days:d,date:c.birthday});
    for(const f of c.family||[]){if(f.clientId&&C(f.clientId)&&!C(f.clientId).deleted)continue;const fd=daysUntilAnnual(f.birthday);if(fd!==null&&fd<=st.birthdayDays)bdays.push({client:c,who:f.name||f.relation,rel:f.relation,days:fd,date:f.birthday})}
  }
  bdays.sort((a,b)=>a.days-b.days);
  const anniv=[];
  for(const p of live('policies')){const c=C(p.clientId);if(!c||c.deleted)continue;if(p.status&&p.status!=='有效')continue;const r=policyNext(p);if(r&&r.days<=st.anniversaryDays)anniv.push({client:c,policy:p,days:r.days,kind:r.kind})}
  anniv.sort((a,b)=>a.days-b.days);
  const stale=cl.filter(c=>c.salesStage!=='暫停'||(c.recruitActive&&c.recruitStage!=='暫停')).map(c=>({client:c,last:lastContact(c.id),days:daysSince(lastContact(c.id))})).filter(x=>x.days===null||x.days>=st.staleDays).sort((a,b)=>(b.days??9999)-(a.days??9999));
  const recruit=cl.filter(c=>c.recruitActive&&!['未啟動','已報到','暫停'].includes(c.recruitStage)).map(c=>({client:c,days:daysSince(lastContact(c.id))})).filter(x=>x.days===null||x.days>=st.recruitDays).sort((a,b)=>(b.days??9999)-(a.days??9999));
  return {todayTasks,overdue,upcoming,bdays,anniv,stale,recruit};
}

function filteredClients(){
  const q=ui.q.trim().toLowerCase();let arr=live('clients');
  if(q)arr=arr.filter(c=>[c.name,c.phone,c.idNo,c.line,c.company,c.job,c.address,c.notes,(c.tags||[]).join(' '),(c.traits||[]).join(' '),c.referrer,...(c.family||[]).map(f=>f.name)].join(' ').toLowerCase().includes(q));
  if(ui.filter==='sales')arr=arr.filter(c=>!['成交','保全服務','暫停','名單'].includes(c.salesStage));
  if(ui.filter==='recruit')arr=arr.filter(c=>c.recruitActive&&!['已報到','暫停'].includes(c.recruitStage));
  if(ui.filter==='stale'){const st=S.settings.staleDays;arr=arr.filter(c=>{const d=daysSince(lastContact(c.id));return d===null||d>=st})}
  if(ui.filter==='customer')arr=arr.filter(c=>['成交','保全服務'].includes(c.salesStage));
  if(ui.sales)arr=arr.filter(c=>c.salesStage===ui.sales);
  if(ui.recruit)arr=arr.filter(c=>c.recruitActive&&c.recruitStage===ui.recruit);
  if(ui.sort==='last')return arr.sort((a,b)=>(lastContact(a.id)||'').localeCompare(lastContact(b.id)||'')||a.name.localeCompare(b.name,'zh-Hant'));
  if(ui.sort==='created')return arr.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  return arr.sort((a,b)=>a.name.localeCompare(b.name,'zh-Hant'));
}

  const list=`<div class="pane-list">
    <div class="row sb" style="margin-bottom:10px"><h1>客戶 <span class="muted small">${arr.length} / ${live('clients').length}</span></h1><div class="row"><button class="btn ${ui.select?'p':''}" data-act="toggleSelect">${ui.select?'完成勾選':'勾選'}</button><button class="btn p" data-act="addClient">＋ 新增客戶</button></div></div>

    <select data-act="recruitFilter" style="width:auto"><option value="">所有增員階段</option>${RECRUIT_STAGES.map(s=>`<option ${ui.recruit===s?'selected':''}>${s}</option>`).join('')}</select>

function clientDetail(c){

  let tabBody='';
  if(ui.tab==='logs'){
    tabBody=logs.length?logs.map(l=>`<div class="log ${l.type==='實地調查'?'survey':''}">
      <div class="h"><span>${fmtDate(l.date,true)} ・ <b>${esc(l.type)}</b></span><span><a href="#" data-act="editLog" data-id="${l.id}">編輯</a></span></div>

    <div class="sec"><h3>備註</h3><div style="white-space:pre-wrap">${esc(c.notes||'')||'<span class="muted">無</span>'}</div></div>`;
  }
  return `<div class="card">
    <div class="row sb"><div class="row"><button class="btn s back" data-act="closeClient">‹ 返回</button><h2 style="margin:0">${esc(c.name)}</h2></div>

function viewSchedule(){
  const t=today();let tasks=live('tasks');
  if(!ui.showDone)tasks=tasks.filter(x=>!x.done);
  tasks.sort((a,b)=>a.date.localeCompare(b.date)||(a.time||'').localeCompare(b.time||''));
  const groups={};for(const x of tasks){(groups[x.date]=groups[x.date]||[]).push(x)}
  const dates=Object.keys(groups).sort();
  const html=dates.map(d=>{const cls=d<t?'over':d===t?'today':'';const label=d<t?`逾期 ・ ${fmtDate(d,true)}`:d===t?`今天 ・ ${fmtDate(d,true)}`:`${fmtDate(d,true)}${daysBetween(t,d)<=7?`（${daysBetween(t,d)} 天後）`:''}`;
    return `<div class="daygroup ${cls}"><h4>${label}</h4><div class="card" style="padding:4px 14px">${groups[d].map(taskRow).join('')}</div></div>`}).join('');
  return `<div class="row sb" style="margin-bottom:6px"><h1>行程與待辦</h1><div class="row"><label class="chk small" style="margin:0"><input type="checkbox" data-act="toggleShowDone" ${ui.showDone?'checked':''}>顯示已完成</label><button class="btn" data-act="exportIcs" title="匯出成行事曆檔，可匯入 Google 日曆">📅 匯出行事曆</button><button class="btn p" data-act="addTask">＋ 新增</button></div></div>
  <p class="small muted" style="margin:0 0 6px">每筆旁的 📅 可直接加到 Google 日曆；「匯出行事曆」會產生 .ics 檔，含所有未完成事項與客戶生日。</p>
  ${dates.length?html:'<div class="card empty">目前沒有行程或待辦</div>'}`;
}

function traitsChips(traits){

}
function traitsFromForm(o){return [...new Set([...(o['traits[]']||[]),...String(o.traits_custom||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean)])]}
function traitsHtml(traits){if(!traits||!traits.length)return '<div class="muted small" style="margin-top:4px">尚未記錄。按「編輯特徵」，或在寫接觸紀錄時直接勾選。</div>';return `<div class="chips sm" style="margin-top:6px">${traits.map(t=>`<span class="chip on" style="cursor:default">${esc(t)}</span>`).join('')}</div>`}
function traitsForm(cid){const c=C(cid);modal(`${esc(c.name)} 的客戶特徵`,traitsChips(c.traits),o=>{c.traits=traitsFromForm(o);put('clients',c);closeModal();render();toast('已更新客戶特徵')})}

function topicPrompt(){
  const t=today();const d=new Date();
  const cl=live('tasks').filter(x=>x.date===t&&!x.done&&x.clientId).map(x=>C(x.clientId)).filter(c=>c&&!c.deleted);
  const traits=[...new Set(cl.flatMap(c=>c.traits||[]))].slice(0,15);
  const base=(S.settings.topicPrompt||DEFAULT_TOPIC_PROMPT).trim();
  let ctx='';
  if(cl.length)ctx+=`\n\n補充：今天（${t}）我預定要見的客戶：${cl.map(c=>`${c.name}（${[c.job,c.salesStage?'銷售階段 '+c.salesStage:'',...(c.traits||[]).slice(0,5)].filter(Boolean).join('、')||'無特徵資料'}）`).join('；')}。請在「適合客群」與需求挖掘對話中盡量貼近他們。`;
  else if(traits.length)ctx+=`\n\n補充：我的客戶常見特徵：${traits.join('、')}。`;
  return `現在是台灣時間 ${t}（${WD[d.getDay()]}）${pad(d.getHours())}:${pad(d.getMinutes())}。請先上網查核最新資訊再回答。\n\n${base}${ctx}`;
}
async function linkTopicFile(){
  if(!FS_OK){alert('這個瀏覽器不支援直接連結檔案，請用 Chrome 或 Edge，或改用「從網址讀取」。');return}
  try{const [h]=await showOpenFilePicker({types:[{description:'今日話題檔',accept:{'text/plain':['.txt','.md'],'application/json':['.json']}}],multiple:false});TH=h;await kvSet('topicHandle',TH);await refreshTopic(true);render();toast('已連結話題檔，之後開啟程式會自動讀取')}
  catch(e){if(e.name!=='AbortError')alert('連結失敗：'+e.message)}
}
async function unlinkTopicFile(){TH=null;topicPermOK=false;await kvDel('topicHandle');render();toast('已解除話題檔連結')}
function detectDate(t){const m=(t||'').slice(0,400).match(/(20\d{2})\s?[\/\-.年]\s?(\d{1,2})\s?[\/\-.月]\s?(\d{1,2})/);return m?`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`:null}
function parseTopicText(raw){
  let text=String(raw||'').replace(/^﻿/,'').trim();
  try{const j=JSON.parse(text);
    if(typeof j==='string')text=j;
    else if(j&&typeof j==='object'){
      const ks=Object.keys(j).filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort();
      if(ks.length)return {date:ks[ks.length-1],text:String(j[ks[ks.length-1]])};
      const body=j.text||j.content||j.topic||j.markdown||j.result;
      if(body)return {date:j.date?String(j.date).slice(0,10):detectDate(String(body)),text:String(body)};
    }
  }catch{}
  return {date:detectDate(text),text};
}
function storeTopic(date,text,src){
  if(!text)return false;const tp=Object.assign({},S.settings.topics||{});const d=date||today();
  if(tp[d]===text)return false;tp[d]=text;for(const k of Object.keys(tp))if(daysBetween(k,today())>60)delete tp[k];
  setSettings({topics:tp,topicLastSrc:src,topicLastAt:Date.now()});return true;
}
async function refreshTopic(force){
  if(!S)return;if(!force&&Date.now()-topicLastRead<10*60*1000)return;topicLastRead=Date.now();let changed=false;
  if(TH){try{let pm=await TH.queryPermission({mode:'read'});if(pm!=='granted'&&force)pm=await TH.requestPermission({mode:'read'});topicPermOK=pm==='granted';
    if(topicPermOK){const f=await TH.getFile();const {date,text}=parseTopicText(await f.text());if(storeTopic(date||iso(new Date(f.lastModified)),text,'檔案 '+f.name))changed=true}
    else if(force)toast('沒有取得讀取話題檔的權限')}catch(e){console.warn(e);if(force)toast('讀取話題檔失敗：'+e.message)}}
  const url=(S.settings.topicUrl||'').trim();
  if(url){try{const r=await fetch(url,{cache:'no-store'});if(r.ok){const {date,text}=parseTopicText(await r.text());if(storeTopic(date,text,'網址'))changed=true}else if(force)toast('話題網址讀取失敗：HTTP '+r.status)}
    catch(e){if(force)toast('話題網址無法讀取（可能沒有網路，或該網址不允許跨站讀取）')}}
  if(changed){render();toast('今日話題已更新')}else if(force&&(TH||url)){render();toast('話題沒有變化')}
}
function mdInline(t){
  return t.replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener" data-act="ext">$1</a>')
    .replace(/(^|[^"'>])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener" data-act="ext">$2</a>');
}
function mdHtml(src){
  const lines=esc(String(src||'')).replace(/\r/g,'').split('\n');
  if(lines.length&&/^\d{4}-\d{2}-\d{2}\s*$/.test(lines[0]))lines.shift(); // 第一行只有日期就不顯示
  let out='',i=0,para=[];
  const flush=()=>{if(para.length){out+=`<p>${mdInline(para.join('<br>'))}</p>`;para=[]}};
  while(i<lines.length){const l=lines[i];
    if(/^\s*$/.test(l)){flush();i++;continue}
    let m;
    if((m=l.match(/^(#{1,6})\s+(.*)$/))){flush();const lv=m[1].length;const tag=lv<=1?'h3':lv===2?'h4':'h5';out+=`<${tag}>${mdInline(m[2])}</${tag}>`;i++;continue}
    if(/^\s*(---+|\*\*\*+)\s*$/.test(l)){flush();out+='<hr>';i++;continue}
    if(/^\s*\|/.test(l)){flush();const rows=[];while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i]);i++}
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      let body='',hdr=true;
      for(const r of rows){if(/^\s*\|?\s*:?-{2,}/.test(r)){continue}const cs=cells(r);body+=`<tr>${cs.map(c=>hdr?`<th>${mdInline(c)}</th>`:`<td>${mdInline(c)}</td>`).join('')}</tr>`;hdr=false}
      out+=`<div class="tw"><table>${body}</table></div>`;continue}
    if(/^\s*([-*•])\s+/.test(l)){flush();out+='<ul>';while(i<lines.length&&/^\s*([-*•])\s+/.test(lines[i])){out+=`<li>${mdInline(lines[i].replace(/^\s*[-*•]\s+/,''))}</li>`;i++}out+='</ul>';continue}
    if(/^\s*\d+[.)]\s+/.test(l)){flush();out+='<ol>';while(i<lines.length&&/^\s*\d+[.)]\s+/.test(lines[i])){out+=`<li>${mdInline(lines[i].replace(/^\s*\d+[.)]\s+/,''))}</li>`;i++}out+='</ol>';continue}
    if(/^\s*&gt;\s?/.test(l)){flush();const q=[];while(i<lines.length&&/^\s*&gt;\s?/.test(lines[i])){q.push(lines[i].replace(/^\s*&gt;\s?/,''));i++}out+=`<blockquote>${mdInline(q.join('<br>'))}</blockquote>`;continue}
    para.push(l.trim());i++;
  }
  flush();return out;
}

  <textarea data-act="topicText" placeholder="${auto?'自動來源會讀進來；也可以在這裡手動貼上或修改。':'按上面的按鈕產生三則話題後貼回這裡（會跟著同步）；或到「設定 → 今日話題自動帶入」讓 Codex 每天自動寫進來。'}" style="min-height:64px">${esc(txt)}</textarea>

function weekRange(){const t=new Date();t.setHours(0,0,0,0);const dow=(t.getDay()+6)%7;const m=new Date(t);m.setDate(t.getDate()-dow);const e=new Date(m);e.setDate(m.getDate()+6);return [iso(m),iso(e)]}
function monthRange(){const t=new Date();return [iso(new Date(t.getFullYear(),t.getMonth(),1)),iso(new Date(t.getFullYear(),t.getMonth()+1,0))]}
function rangeStats([from,to]){
  const inR=d=>d&&d>=from&&d<=to,inT=ts=>ts&&inR(iso(new Date(ts)));
  const logs=live('logs').filter(l=>inR(l.date)),cl=live('clients');
  return {visits:logs.filter(l=>l.type==='拜訪'||l.type==='實地調查').length,calls:logs.filter(l=>l.type==='電話'||l.type==='LINE/訊息').length,dials:live('listItems').filter(i=>inR(i.calledAt)).length,newClients:cl.filter(c=>inT(c.createdAt)).length,closed:cl.filter(c=>inT(c.closedAt)).length,recruited:cl.filter(c=>inT(c.recruitedAt)).length};
}
function statsCard(){
  const w=rangeStats(weekRange()),m=rangeStats(monthRange());
  const row=(l,a,b)=>`<div>${l}</div><div><b>${a}</b></div><div><b>${b}</b></div>`;
  return `<div class="card"><h3>活動統計 <span class="small muted" style="font-weight:400">本週（一到日）／本月</span></h3><div class="stat"><div class="h">項目</div><div class="h">本週</div><div class="h">本月</div>
  ${row('拜訪 / 實地調查',w.visits,m.visits)}${row('電話 / 訊息紀錄',w.calls,m.calls)}${row('電訪名單撥打',w.dials,m.dials)}${row('新增客戶',w.newClients,m.newClients)}${row('成交',w.closed,m.closed)}${row('增員報到',w.recruited,m.recruited)}</div></div>`;
}

/* ========= 名單匯入 (CSV / Excel 另存 CSV) ========= */
function parseCsv(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}else{if(ch==='"')q=true;else if(ch===','){row.push(cur);cur=''}else if(ch==='\n'){row.push(cur);rows.push(row);row=[];cur=''}else if(ch!=='\r')cur+=ch}}if(cur||row.length){row.push(cur);rows.push(row)}return rows.filter(r=>r.some(v=>v.trim()))}
function normDate(x){x=(x||'').trim();if(!x)return '';let m=x.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(m)return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;m=x.match(/^(\d{2,3})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(m)return `${+m[1]+1911}-${pad(+m[2])}-${pad(+m[3])}`;return ''}
function importCsv(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,text/csv';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;const buf=await f.arrayBuffer();let text=new TextDecoder('utf-8').decode(buf);if(text.includes('�')){try{text=new TextDecoder('big5').decode(buf)}catch{}}text=text.replace(/^﻿/,'');
    const rows=parseCsv(text);if(rows.length<2){alert('檔案裡沒有資料列。第一列要是欄位名稱，第二列起是客戶。');return}
    const head=rows[0].map(h=>h.trim().toLowerCase());const col={};for(const [k,names] of Object.entries(IMPORT_MAP)){const i=head.findIndex(h=>names.some(n=>h===n.toLowerCase()||h.includes(n.toLowerCase())));if(i>=0)col[k]=i}
    if(col.name===undefined){alert('找不到「姓名」欄位。第一列必須是欄位名稱，至少要有「姓名」。\n可辨識的欄位：姓名、電話、LINE、Email、地址、生日、性別、公司、職業、來源、介紹人、標籤、身分證字號、備註');return}
    if(!confirm(`將匯入 ${rows.length-1} 列資料，辨識到的欄位：${Object.keys(col).map(k=>rows[0][col[k]]).join('、')}。\n姓名與電話都相同的客戶會略過。要繼續嗎？`))return;
    const existing=new Set(live('clients').map(c=>c.name+'|'+(c.phone||'')));let n=0,skip=0;
    for(const r of rows.slice(1)){const g=k=>col[k]!==undefined?(r[col[k]]||'').trim():'';const name=g('name');if(!name)continue;const phone=g('phone').replace(/[^\d+]/g,'');if(existing.has(name+'|'+phone)){skip++;continue}
      const gd=g('gender');const src=SOURCES.find(x=>g('source').includes(x))||(g('source')?'其他':'緣故');
      put('clients',{id:uid(),name,phone,line:g('line'),email:g('email'),address:g('address'),birthday:normDate(g('birthday')),gender:gd.includes('女')?'女':gd.includes('男')?'男':'',idNo:g('idNo').toUpperCase(),company:g('company'),job:g('job'),source:src,referrer:g('referrer'),tags:g('tags').split(/[,，、\s]+/).map(x=>x.trim()).filter(Boolean),salesStage:'名單',salesNote:'',recruitActive:false,recruitStage:'未啟動',recruitNote:'',notes:g('notes'),family:[],traits:[]});
      existing.add(name+'|'+phone);n++}
    render();toast(`已匯入 ${n} 位客戶${skip?`，略過 ${skip} 位重複`:''}`)};
  inp.click();
}

/* ========= 行事曆 ========= */
const ymd=s=>s.replace(/-/g,'');
function gcalUrl(t){
  const c=t.clientId?C(t.clientId):null;let dates;
  if(t.time){const [h,m]=t.time.split(':');const e=new Date(`${t.date}T${t.time}:00`);e.setHours(e.getHours()+1);dates=`${ymd(t.date)}T${h}${m}00/${ymd(iso(e))}T${pad(e.getHours())}${pad(e.getMinutes())}00`}
  else{const n=parseDate(t.date);n.setDate(n.getDate()+1);dates=`${ymd(t.date)}/${ymd(iso(n))}`}
  const details=[c?`客戶：${c.name}`:'',c&&c.phone?`電話：${c.phone}`:'',t.note||''].filter(Boolean).join('\n');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(t.title)}&dates=${dates}&details=${encodeURIComponent(details)}${c&&c.address?`&location=${encodeURIComponent(c.address)}`:''}`;
}
const icsEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
function exportIcs(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//sales-secretary//TW','CALSCALE:GREGORIAN','X-WR-CALNAME:業務秘書'];
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z');
  const ev=(uid,summary,ds,de,desc,rrule)=>{L.push('BEGIN:VEVENT',`UID:${uid}@sales-secretary`,`DTSTAMP:${stamp}`,ds,de,`SUMMARY:${icsEsc(summary)}`);if(desc)L.push(`DESCRIPTION:${icsEsc(desc)}`);if(rrule)L.push(rrule);L.push('END:VEVENT')};
  let n=0;
  for(const t of live('tasks').filter(x=>!x.done)){const c=t.clientId?C(t.clientId):null;const desc=[c?`客戶：${c.name}${c.phone?' '+c.phone:''}`:'',t.note||''].filter(Boolean).join('\n');
    if(t.time){const [h,m]=t.time.split(':');const e=new Date(`${t.date}T${t.time}:00`);e.setHours(e.getHours()+1);ev(t.id,t.title,`DTSTART:${ymd(t.date)}T${h}${m}00`,`DTEND:${ymd(iso(e))}T${pad(e.getHours())}${pad(e.getMinutes())}00`,desc)}
    else{const d=parseDate(t.date);d.setDate(d.getDate()+1);ev(t.id,t.title,`DTSTART;VALUE=DATE:${ymd(t.date)}`,`DTEND;VALUE=DATE:${ymd(iso(d))}`,desc)}n++}
  for(const c of live('clients')){if(c.birthday&&c.birthday.length===10){const d=parseDate(c.birthday);if(!d)continue;d.setDate(d.getDate()+1);ev('bday-'+c.id,`${c.name} 生日`,`DTSTART;VALUE=DATE:${ymd(c.birthday)}`,`DTEND;VALUE=DATE:${ymd(iso(d))}`,'','RRULE:FREQ=YEARLY');n++}}
  L.push('END:VCALENDAR');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));a.download=`業務秘書行事曆_${today()}.ics`;a.click();
  toast(`已下載 ${n} 筆事項的行事曆檔，到 Google 日曆「設定 → 匯入」即可`);
}

        <div class="d small muted">${esc([c.company,c.job].filter(Boolean).join(' '))}${lc?` ・ 上次聯絡 ${fmtDate(lc)}`:''}${i.calledAt?` ・ 本次撥打 ${fmtDate(i.calledAt)}`:''}</div></div>
      <select data-act="listStatus" data-id="${i.id}" style="width:auto">${CALL_STATUS.map(s=>`<option ${(i.status||'未撥')===s?'selected':''}>${s}</option>`).join('')}</select>

}

function addClientsToList(lid,ids){

  return n;
}

function renderPickList(lid){
  const box=$('#pickList');if(!box)return;

  const have=new Set(listItemsOf(lid).map(i=>i.clientId));

  Object.assign(ui,{q:ui.pick.q,filter:ui.pick.f,sales:'',recruit:''});

function modal(title,inner,onSubmit,extraButtons){
  closeModal();
  const m=document.createElement('div');m.className='modal';m.id='modal';
  m.innerHTML=`<div class="box"><h3>${title}</h3><form id="mform">${inner}<div class="actions">${extraButtons||''}<button type="button" class="btn" data-act="closeModal">取消</button><button class="btn p">儲存</button></div></form></div>`;
  document.body.appendChild(m);
  m.addEventListener('click',e=>{if(e.target===m)closeModal()});
  m.querySelector('#mform').addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);const o={};for(const [k,v] of fd.entries()){if(k.endsWith('[]')){(o[k]=o[k]||[]).push(v)}else o[k]=v.trim?v.trim():v}onSubmit(o,e.target);});
  const first=m.querySelector('input:not([type=hidden]),select,textarea');if(first&&window.innerWidth>760)first.focus();
}

document.addEventListener('click',async e=>{

    case 'nav':ui.view=el.dataset.v;if(ui.view!=='clients'){ui.clientId=null;ui.select=false}if(ui.view!=='lists')ui.listId=null;render();window.scrollTo(0,0);break;

    case 'openClient':ui.view='clients';ui.clientId=id;ui.tab='logs';render();window.scrollTo(0,0);break;
    case 'closeClient':ui.clientId=null;ui.showId=null;render();break;

  }
});

    case 'toggleTask':{const t=S.tasks[id];t.done=el.checked;t.doneAt=el.checked?Date.now():null;put('tasks',t);render();break}
    case 'setSales':{const c=C(id);if(el.value==='成交'&&c.salesStage!=='成交')c.closedAt=Date.now();c.salesStage=el.value;put('clients',c);render();break}
    case 'setRecruit':{const c=C(id);if(el.value==='已報到'&&c.recruitStage!=='已報到')c.recruitedAt=Date.now();c.recruitStage=el.value;put('clients',c);render();break}
    case 'setRecruitActive':{const c=C(id);c.recruitActive=el.checked;if(el.checked&&(!c.recruitStage||c.recruitStage==='未啟動'))c.recruitStage='聊過意願';put('clients',c);render();break}
    case 'salesFilter':ui.sales=el.value;render();break;
    case 'recruitFilter':ui.recruit=el.value;render();break;
    case 'toggleShowDone':ui.showDone=el.checked;render();break;
    case 'selClient':if(el.checked)ui.selected.add(id);else ui.selected.delete(id);render();break;
    case 'sortClients':ui.sort=el.value;render();break;
    case 'topicPromptText':setSettings({topicPrompt:el.value.trim()});toast('提示詞已儲存');break;
    case 'topicUrlText':setSettings({topicUrl:el.value.trim()});toast(el.value.trim()?'已儲存網址，開啟程式時會自動讀取':'已清除網址');if(el.value.trim())refreshTopic(true);break;
    case 'topicText':{const tp=Object.assign({},S.settings.topics||{});tp[today()]=el.value.trim();for(const k of Object.keys(tp))if(daysBetween(k,today())>60)delete tp[k];setSettings({topics:tp});toast('已儲存今日話題');break}
    case 'listStatus':{const it=S.listItems[id];it.status=el.value;if(el.value!=='未撥')it.calledAt=today();put('listItems',it);render();break}
    case 'listNote':{const it=S.listItems[id];it.note=el.value.trim();put('listItems',it);break}
    case 'toggleTopicShow':setSettings({topicShow:el.checked});toast(el.checked?'首頁會顯示今日話題':'首頁不再顯示今日話題（有自動來源或內容時仍會顯示）');break;
    case 'toggleRemember':if(el.checked)localStorage.setItem('ss.pass',PASS);else localStorage.removeItem('ss.pass');toast(el.checked?'已記住密碼':'已取消記住');break;
  }
});
document.addEventListener('input',e=>{if(e.target.dataset.act==='search'){ui.q=e.target.value;ui.focusSearch=true;render()}else if(e.target.id==='pickSearch'){ui.pick.q=e.target.value;renderPickList(ui.listId)}});
document.addEventListener('submit',e=>{
  if(e.target.dataset.act==='saveRules'){e.preventDefault();const fd=new FormData(e.target);setSettings({owner:fd.get('owner').trim(),staleDays:+fd.get('staleDays')||30,birthdayDays:+fd.get('birthdayDays')||0,anniversaryDays:+fd.get('anniversaryDays')||0,recruitDays:+fd.get('recruitDays')||3});render();toast('規則已儲存')}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

/* ========= 啟動、鎖定、初始設定 ========= */
function screen(html){$('#app').innerHTML=`<div class="center"><div class="card">${html}</div></div>`}
function renderOnboarding(){
  screen(`<h1>🛡 ${APP_NAME}</h1><p class="muted">你的客戶與增員秘書。資料只存在這台裝置和你自己的加密同步檔，不經任何伺服器。</p>
  <form id="ob"><label class="f"><span class="l">你的稱呼</span><input type="text" name="owner" placeholder="例如：王主任"></label>
  <label class="f"><span class="l">設定加密密碼（至少 6 碼，請務必記住，忘記無法復原）</span><input type="password" name="p1" required minlength="6"></label>
  <label class="f"><span class="l">再輸入一次</span><input type="password" name="p2" required></label>
  <label class="chk"><input type="checkbox" name="remember" checked>在這台裝置記住密碼</label>
  <button class="btn p" style="width:100%;justify-content:center">開始使用</button></form>
  <p class="small muted" style="margin-top:14px;text-align:center">已經在別台裝置用過？<a href="#" id="obImport">匯入既有同步檔</a>${googleAvailable()?'<br><a href="#" id="obGoogle">← 改用 Google 帳號登入</a>':''}</p>`);
  const og=$('#obGoogle');if(og)og.addEventListener('click',e=>{e.preventDefault();renderWelcome()});
  $('#ob').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);if(fd.get('p1')!==fd.get('p2')){alert('兩次密碼不同');return}
    PASS=fd.get('p1');S=blank();S.settings.owner=fd.get('owner').trim();S.settings.updatedAt=Date.now();
    if(fd.get('remember'))localStorage.setItem('ss.pass',PASS);await doSave();start()});
  $('#obImport').addEventListener('click',e=>{e.preventDefault();
    const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;let pkg;try{pkg=JSON.parse(await f.text())}catch{alert('檔案格式不正確');return}
      const p=prompt('請輸入這個同步檔的密碼：');if(!p)return;
      try{S=await decryptObj(pkg,p)}catch{alert('密碼錯誤或檔案損毀');return}
      PASS=p;if(confirm('要在這台裝置記住密碼嗎？（手機建議不要）'))localStorage.setItem('ss.pass',PASS);await doSave();start();toast('匯入完成')};
    inp.click()});
}
function renderUnlock(blob){
  screen(`<h1>🛡 ${APP_NAME}</h1><p class="muted">請輸入密碼解鎖</p><form id="ul"><label class="f"><input type="password" name="p" required autofocus placeholder="密碼"></label>
  <label class="chk"><input type="checkbox" name="remember">在這台裝置記住密碼</label><button class="btn p" style="width:100%;justify-content:center">解鎖</button><p id="ulErr" class="small" style="color:var(--bad)"></p></form>
  <p class="small muted" style="margin-top:14px;text-align:center">忘記密碼？<a href="#" id="ulReset">清除這台裝置的資料，重新開始</a></p>`);
  $('#ulReset').addEventListener('click',async e=>{e.preventDefault();if(!confirm('這會刪除這台裝置上的資料（雲端硬碟裡的同步檔不受影響，之後可以再匯入）。確定要重新開始嗎？'))return;
    try{await kvDel('blob');await kvDel('handle');await kvDel('topicHandle')}catch{}localStorage.removeItem('ss.pass');location.reload()});
  $('#ul').addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(e.target);const p=fd.get('p');
    try{S=await decryptObj(blob,p);PASS=p;if(fd.get('remember'))localStorage.setItem('ss.pass',p);start()}catch{$('#ulErr').textContent='密碼錯誤'}});
}
async function start(){
  if(migrate(S))save();
  render();
  if(FH){
    if(await hasPerm(false)){await pullFile(true)}
    else{const main=document.querySelector('main');if(main)main.insertAdjacentHTML('afterbegin',`<div class="banner">🔗 同步檔「${esc(FH.name)}」需要重新授權才能自動同步。<button class="btn s p" data-act="grantPerm">按一下允許</button></div>`)}
  }
  refreshTopic(false);
  if(MODE==='google')cloudSync();
}
async function boot(){
  if(!window.crypto||!crypto.subtle){screen('<h2>無法啟動</h2><p>這個瀏覽器不支援加密功能，請改用 Chrome、Edge 或 Safari 開啟。</p>');return}
  let blob;try{blob=await kvGet('blob');FH=(await kvGet('handle'))||null;TH=(await kvGet('topicHandle'))||null}catch(e){screen('<h2>無法啟動</h2><p>瀏覽器不允許儲存資料（可能是無痕模式）。請用一般視窗開啟。</p>');return}
  if(!blob){renderWelcome();return}
  if(MODE==='google'){
    PASS=devKey();
    try{S=await decryptObj(blob,PASS)}catch(e){screen(`<h2>無法讀取本機資料</h2><p class="muted">這台裝置上的資料無法解開。清除後重新登入 Google，資料會從雲端下載回來。</p><button class="btn p" id="rst" style="width:100%;justify-content:center">清除並重新開始</button>`);$('#rst').onclick=()=>wipeDevice();return}
    if(localStorage.getItem('ss.pinHash'))renderPinLock();else start();
    return;
  }
  const remembered=localStorage.getItem('ss.pass');
  if(remembered){try{S=await decryptObj(blob,remembered);PASS=remembered;start();return}catch{localStorage.removeItem('ss.pass')}}
  renderUnlock(blob);
}
boot();
if(location.protocol==='https:'&&'serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
